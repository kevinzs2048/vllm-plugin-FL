name: Build Wheel

on:
  workflow_call:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      upload-artifact:
        description: "Whether to upload the built wheel as an artifact"
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 2)
        id: checkout2
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        continue-on-error: true
      - name: Checkout (attempt 3)
        if: steps.checkout2.outcome == 'failure'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build --wheel

      - name: Verify wheel
        run: |
          pip install dist/*.whl
          # Verify package metadata and file structure (full import requires flag_gems runtime)
          python -c "
          from importlib.metadata import metadata, files
          meta = metadata('vllm-plugin-fl')
          print(f\"Package: {meta['Name']} {meta['Version']}\")
          pkg_files = [str(f) for f in files('vllm-plugin-fl')]
          assert any('vllm_fl' in f for f in pkg_files), 'vllm_fl module not found in wheel'
          print(f'Installed files: {len(pkg_files)}')
          print('Wheel verified successfully')
          "

      - name: Upload wheel
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  build-arm:
    name: Build Check (AArch64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build ARM package
        run: python -m build --wheel

      - name: Verify ARM wheel tag and native assets
        run: |
          python - <<'PY'
          import pathlib
          import zipfile

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-linux_aarch64.whl"), wheel.name
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "cpu_quant_linear.py",
              "cpu_int4_pack.c",
              "cpu_int4_tle_wrapper.c",
              "cpu_int8_tle_wrapper.c",
              "libkai_w8a8.so",
          }
          packaged = {pathlib.PurePosixPath(name).name for name in names}
          assert required <= packaged, required - packaged
          assert "cpu_int8_kai_wrapper.c" not in packaged
          assert not any(name.endswith(".o") for name in names)
          PY
          pip install --no-deps dist/*.whl
          python - <<'PY'
          import ctypes
          from importlib.metadata import files

          library = next(
              path.locate()
              for path in files("vllm-plugin-fl")
              if str(path).endswith("vllm_fl/ops/libkai_w8a8.so")
          )
          runtime = ctypes.CDLL(str(library))
          for symbol in (
              "fl_w8a8_linear",
              "fl_w8a8_pack_rhs",
              "fl_w8a8_rhs_packed_size",
          ):
              getattr(runtime, symbol)
          PY

      - name: Upload ARM wheel
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-arm64
          path: dist/*.whl
